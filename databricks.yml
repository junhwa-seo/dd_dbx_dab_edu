# This is a Declarative Automation Bundle definition for dd_dbx_dab_edu.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dd_dbx_dab_edu
  uuid: f0341163-9a52-480a-8942-a61582353b19

include:
  - resources/*.job.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev_sjh:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-27c6e772-6907.cloud.databricks.com
    variables:
      catalog: training
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-27c6e772-6907.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/e997f61b-4e21-4b6e-b254-ad0843fb0c97 to make sure we only have a single copy.
      root_path: /Workspace/Users/e997f61b-4e21-4b6e-b254-ad0843fb0c97/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: training
      schema: prod
    permissions:
      - service_principal_name: e997f61b-4e21-4b6e-b254-ad0843fb0c97
        level: CAN_MANAGE
