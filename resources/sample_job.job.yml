# A sample job for dd_dbx_dab_edu.

resources:
  jobs:
    sjh_job_training:
      name: sjh_job_training
      tasks:
        - task_key: create_bronze
          notebook_task:
            notebook_path: ../src/create_online_retail_bronze_autoloader.py
            source: WORKSPACE
        - task_key: create_silver
          depends_on:
            - task_key: create_bronze
          notebook_task:
            notebook_path: ../src/create_online_retail_silver_autoloader.py
            source: WORKSPACE
        - task_key: create_gold
          depends_on:
            - task_key: create_silver
          notebook_task:
            notebook_path: ../src/create_online_retail_gold_autoloader.py
            source: WORKSPACE
      queue:
        enabled: true
      run_as:
        service_principal_name: e997f61b-4e21-4b6e-b254-ad0843fb0c97
      performance_target: PERFORMANCE_OPTIMIZED
